version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: smartbank_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartbank
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: smartbank_api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgres://postgres:password@postgres:5432/smartbank
      JWT_SECRET: supersecretkey
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  # frontend:
  #   build: ./frontend
  #   container_name: smartbank_ui
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  postgres_data:
